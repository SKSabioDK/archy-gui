# Ugentlig sårbarhedsscanning. Finder den noget, oprettes (eller opdateres) en
# issue med etiketten "security", så du får besked fra GitHub.
#
# Testene køres på hver understøttet Node-hovedversion (seneste udgave af hver),
# så en ny Node-udgivelse der ødelægger noget, opdages her og ikke på en pc.
# Hold listen i takt med engines.node i package.json.
name: Ugentlig sårbarhedsscanning

on:
  schedule:
    - cron: '0 6 * * 1'   # mandag kl. 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.audit.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Installér afhængigheder
        run: npm ci || npm install
      - name: npm audit (kun produktionspakker)
        id: audit
        run: |
          set +e
          npm audit --omit=dev > audit.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: audit
          path: audit.txt

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Installér afhængigheder
        run: npm ci || npm install
      - name: Tests på Node ${{ matrix.node }} (inkl. kravet til Node-versionen)
        run: |
          set -o pipefail
          node -v | tee tests-node${{ matrix.node }}.txt
          npm test 2>&1 | tee -a tests-node${{ matrix.node }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-node${{ matrix.node }}
          path: tests-node${{ matrix.node }}.txt

  report:
    needs: [audit, tests]
    if: always() && (needs.audit.outputs.code != '0' || needs.tests.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
      - name: Opret eller opdatér issue ved fund
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Den ugentlige scanning fandt noget. Kørsel: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ "${{ needs.audit.outputs.code }}" != "0" ]; then
              echo "### npm audit"
              echo '```'
              head -c 20000 audit/audit.txt
              echo '```'
            fi
            for f in tests-node*/tests-node*.txt; do
              [ -f "$f" ] || continue
              grep -q "^ℹ fail 0" "$f" && continue
              echo "### Tests fejlede på $(head -n 1 "$f")"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            done
          } > body.md
          gh label create security --color B60205 --description "Sårbarhedsscanning" 2>/dev/null || true
          existing=$(gh issue list --label security --state open --search "Ugentlig sårbarhedsscanning" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Ugentlig sårbarhedsscanning: fund" --label security --body-file body.md
          fi
